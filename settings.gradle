pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            // Both dev.architectury.loom (remap, pre-26.1) and
            // dev.architectury.loom-no-remap (unobfuscated, 26.1+) live in the same artifact.
            if (requested.id.id.startsWith('dev.architectury.loom')) {
                useModule("dev.architectury:architectury-loom:${requested.version}")
            }
        }
    }
}

rootProject.name = 'ExposurePolaroid'

include 'common'
include 'fabric'
