plugins {
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name-$rootProject.minecraft_version"
    }

    repositories {
        // Local maven (published Exposure New Port lives here)
        mavenLocal()

        var localPath = System.getenv("MAVEN_LOCAL")
        if (localPath != null) {
            maven {
                name = 'mortuusarsLocal'
                url = uri(localPath + "/maven")
            }
        }

        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }

        maven {
            url = "https://maven.architectury.dev"
            content {
                includeGroup "dev.architectury"
            }
        }

        maven {
            url = "https://cursemaven.com"
        }

        // Forge Config Api Port
        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }

        // JEI
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }

        maven {
            name = "FabricMC"
            url = "https://maven.fabricmc.net/"
        }

        maven {
            name = "Mortuusars Github Maven"
            url = "https://raw.githubusercontent.com/mortuusars/resources/main/maven/"
        }

        maven { url = "https://api.modrinth.com/maven" }
    }

    loom {
        enableModProvidedJavadoc = false
        runs {
            client {
                property 'item_asset_export.render.namespaces', 'exposure_polaroid'
                vmArgs '-XX:+AllowEnhancedClassRedefinition', '-XX:HotswapAgent=core'
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        // 26.1 is unobfuscated (loom-no-remap): no mappings dependency.
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    processResources {
        var expandProps = [
                minecraft_version                     : minecraft_version,
                minecraft_version_range               : minecraft_version_range,
                mod_id                                : mod_id,
                mod_name                              : mod_name,
                mod_version                           : mod_version,
                mod_authors                           : mod_authors,
                mod_description                       : mod_description,
                mod_issues                            : mod_issues,
                mod_page                              : mod_page,
                mod_github                            : mod_github,
                mod_license                           : mod_license,
                maven_group                           : maven_group,
                required_exposure_version_range_fabric: required_exposure_version_range_fabric
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', "*.mixins.json"]) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    publishing {
        publications {
            maven(MavenPublication) {
                artifactId = "${mod_id}-${minecraft_version}-${project.name}"
                version = "${mod_version}"
                from components.java
            }
        }

        repositories {
            var localPath = System.getenv("MAVEN_LOCAL")
            if (localPath != null) {
                maven {
                    name = 'mortuusarsLocal'
                    url = uri(localPath + "/maven")
                }
            }

            var resourcesPath = System.getenv("MAVEN_GITHUB_RESOURCES")
            if (resourcesPath != null) {
                maven {
                    name = 'mortuusarsGithubResources'
                    url = uri(resourcesPath + "/maven")
                }
            }
        }
    }
}
